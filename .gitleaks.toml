[extend]
useDefault = true

[[allowlists]]
description = "Public uquant API-contract SHA-256 identity, not a credential"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = [
  '''^src/firmquant/resources/source_identity\.json$''',
  '''^tests/(integration/test_uquant_parity|unit/test_build_identity|unit/strategy/test_identity)\.py$''',
]
regexes = [
  '''^\s*"public_api_contract_sha256"\s*:\s*"[a-f0-9]{64}",?\s*$''',
  '''^\s*EXPECTED_PUBLIC_(API_)?CONTRACT_SHA256\s*=\s*"[a-f0-9]{64}"\s*$''',
]
