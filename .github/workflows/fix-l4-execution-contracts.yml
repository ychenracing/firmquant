name: Fix L4 execution contracts

on:
  pull_request:

permissions:
  contents: write

env:
  FIRMQ_CI: "1"
  FIRMQ_MODE: PAPER
  FIRMQ_LIVE_TRADING_ENABLED: "false"
  UV_FROZEN: "1"

jobs:
  repair:
    if: github.head_ref == 'codex/execution-evidence-readiness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          clean: false
          fetch-depth: 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ychenracing/uquant
          ref: 105695aacd3d1c7e62705f64188da88d202db4cd
          path: .uquant-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: "0.11.33"
      - name: Apply root-cause repairs
        shell: bash
        run: |
          printf '%s\n' '.uquant-source/' >> .git/info/exclude
          uv sync --frozen --extra dev
          uv run python scripts/fix_l4_execution_contracts.py
          uv run ruff format \
            src/firmquant/execution/execution_replay.py \
            src/firmquant/execution/replay_runner.py \
            tests/integration/test_cli_operations.py \
            tests/unit/execution/test_execution_replay.py \
            .github/workflows/ci.yml
          uv run ruff check \
            src/firmquant/execution/execution_replay.py \
            src/firmquant/execution/replay_runner.py \
            tests/integration/test_cli_operations.py \
            tests/unit/execution/test_execution_replay.py
          uv run mypy src scripts
      - name: Verify failed L4 nodes and price precision
        env:
          FIRMQUANT_UQUANT_SOURCE_CHECKOUT: ${{ github.workspace }}/.uquant-source
          PYTHONPATH: ${{ github.workspace }}/.uquant-source:${{ github.workspace }}/src
        run: |
          uv run pytest \
            tests/integration/test_cli_operations.py::test_arm_disarm_and_halt_are_durable_and_never_echo_sensitive_identity \
            tests/integration/test_cli_operations.py::test_status_authenticates_active_lease_and_fails_closed_after_mac_tamper \
            tests/integration/test_cli_operations.py::test_status_does_not_trust_a_lease_when_the_mac_secret_is_unavailable \
            tests/integration/test_cli_operations.py::test_resume_revokes_an_existing_lease_even_when_halt_came_from_another_path \
            tests/integration/test_execution_replay_restart.py \
            tests/unit/execution/test_execution_replay.py \
            -q
      - name: Commit verified repair
        shell: bash
        run: |
          rm -f scripts/fix_l4_execution_contracts.py
          rm -f .github/workflows/fix-l4-execution-contracts.yml
          rm -f .github/workflows/full-execution-replay.yml
          git config user.name firmquant-bot
          git config user.email firmquant-bot@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Fix L4 execution evidence contracts"
          git push origin HEAD:codex/execution-evidence-readiness
