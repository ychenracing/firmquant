name: Temporary mypy diagnostic

on:
  push:
    branches:
      - codex/production-live-hardening-20260826

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !startsWith(github.event.head_commit.message, 'diag(auto):') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.11.33"
      - run: uv sync --frozen --extra dev
      - name: Capture strict mypy output
        shell: bash
        run: |
          set +e
          uv run mypy src tests > .mypy-diagnostic.txt 2>&1
          status=$?
          set -e
          printf '\nmypy_exit_code=%s\n' "$status" >> .mypy-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .mypy-diagnostic.txt
          git commit -m "diag(auto): capture mypy output"
          git push origin HEAD:${GITHUB_REF_NAME}
