name: Temporary mypy remediation

on:
  push:
    branches:
      - codex/production-live-hardening-20260826

permissions:
  contents: write

jobs:
  remediate:
    if: ${{ !startsWith(github.event.head_commit.message, 'fix(auto):') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.11.33"
      - run: uv sync --frozen --extra dev
      - name: Apply strict-mypy remediation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/firmquant/broker/xtquant_production.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace("from typing import cast\n", "")
          text = text.replace("    BrokerEventSink,\n", "")
          text = text.replace(
              "return value if is_client_order_tag(value) else None",
              "return value if isinstance(value, str) and is_client_order_tag(value) else None",
          )
          text = text.replace(
              "sink = cast(BrokerEventSink | None, self._sink)",
              "sink = self._sink",
          )
          path.write_text(text, encoding="utf-8", newline="\n")
          PY
          uv run ruff format src/firmquant/broker/xtquant_production.py
          uv run ruff check src/firmquant/broker/xtquant_production.py
          uv run mypy src scripts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/firmquant/broker/xtquant_production.py
          git commit -m "fix(auto): satisfy strict mypy for production broker"
          git push origin HEAD:${GITHUB_REF_NAME}
