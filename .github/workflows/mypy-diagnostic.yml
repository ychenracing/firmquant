name: Mypy diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  mypy-diagnostic:
    if: github.head_ref == 'codex/execution-evidence-readiness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: "0.11.33"
      - name: Capture mypy
        shell: bash
        run: |
          uv sync --frozen --extra dev
          set +e
          uv run mypy src scripts > mypy.txt 2>&1
          code=$?
          echo "$code" > mypy-exit.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: mypy-diagnostic
          path: |
            mypy.txt
            mypy-exit.txt
