name: format-reviewed-preflight

on:
  push:
    branches:
      - codex/account-authority-reconciliation
    paths:
      - .github/workflows/_format_reviewed_preflight.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/account-authority-reconciliation
          fetch-depth: 0
      - name: Format exactly one source file
        run: |
          python -m pip install --disable-pip-version-check ruff==0.16.4
          ruff format src/firmquant/reconciliation/account_preflight.py
          rm .github/workflows/_format_reviewed_preflight.yml
      - name: Commit and self-delete
        run: |
          git config user.name firmquant-agent
          git config user.email firmquant-agent@users.noreply.github.com
          git add -A
          git commit -m "style: format reviewed account preflight"
          git push origin HEAD:codex/account-authority-reconciliation
