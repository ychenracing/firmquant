name: tmp-fix-account-coverage
on:
  push:
    branches:
      - codex/account-authority-reconciliation-coverage-final
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Patch test helper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/unit/reconciliation/test_account_authority_additional_edges.py')
          text = path.read_text(encoding='utf-8')
          old = "def _runtime_repository(tmp_path: Path, *, clock=lambda: NOW):\n    database = Database.open(tmp_path / \"firmquant.sqlite3\")"
          new = "def _runtime_repository(tmp_path: Path, *, clock=lambda: NOW):\n    tmp_path.mkdir(parents=True, exist_ok=True)\n    database = Database.open(tmp_path / \"firmquant.sqlite3\")"
          if text.count(old) != 1:
              raise SystemExit('expected helper anchor exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git rm .github/workflows/tmp-fix-account-coverage.yml
          git config user.name firmquant-agent
          git config user.email firmquant-agent@users.noreply.github.com
          git add tests/unit/reconciliation/test_account_authority_additional_edges.py
          git commit -m "test: fix account coverage fixture directory"
          git push origin HEAD:codex/account-authority-reconciliation-coverage-final
