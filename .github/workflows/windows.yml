name: Windows deployment safety

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

env:
  FIRMQ_CI: "1"
  FIRMQ_MODE: PAPER
  FIRMQ_BROKER_ADAPTER: PAPER
  FIRMQ_LIVE_TRADING_ENABLED: "false"
  PYTHONDONTWRITEBYTECODE: "1"
  UV_FROZEN: "1"

jobs:
  deployment-smoke:
    name: Python 3.12 / PAPER-only
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.11.33"
          enable-cache: true
      - name: Sync exact locked environment
        run: uv sync --frozen --extra dev
      - name: Verify locked uquant identity
        run: uv run python scripts/verify_source_baseline.py
      - name: Run Windows-safe persistence and doctor tests
        run: >-
          uv run pytest
          tests/unit/observability/test_doctor.py
          tests/integration/test_writer_lease.py
          tests/integration/test_backup.py
          tests/contract/test_xtquant_adapter.py
          tests/integration/test_xtquant_import_smoke.py
          -q
      - name: Run PAPER-only deployment smoke
        run: uv run python scripts/windows_smoke.py
      - name: Verify CLI surface
        run: uv run python -m firmquant --help
