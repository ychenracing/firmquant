name: Windows deployment safety

on:
  push:
    branches:
      - "codex/production-live-hardening-20260826"

permissions:
  contents: write

env:
  FIRMQ_CI: "1"
  FIRMQ_MODE: PAPER
  FIRMQ_LIVE_TRADING_ENABLED: "false"
  UV_FROZEN: "1"

jobs:
  format-final-coverage-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.11.33"
      - run: uv sync --frozen --extra dev --quiet
      - run: >-
          uv run ruff format
          tests/unit/application/test_production_identity_branches.py
          tests/unit/broker/test_production_factory_branches.py
      - run: >-
          uv run ruff check
          tests/unit/application/test_production_identity_branches.py
          tests/unit/broker/test_production_factory_branches.py
      - run: >-
          uv run pytest -q --no-cov
          tests/unit/application/test_production_identity_branches.py
          tests/unit/broker/test_production_factory_branches.py
      - shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/unit/application/test_production_identity_branches.py \
            tests/unit/broker/test_production_factory_branches.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: format final coverage tests"
          git push origin HEAD:${GITHUB_REF_NAME}
