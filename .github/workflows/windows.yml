name: Windows deployment safety

on:
  push:
    branches:
      - "codex/production-live-hardening-20260826"

permissions:
  contents: write

env:
  FIRMQ_CI: "1"
  FIRMQ_MODE: PAPER
  FIRMQ_LIVE_TRADING_ENABLED: "false"
  UV_FROZEN: "1"

jobs:
  decision-recovery-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ychenracing/uquant
          ref: 105695aacd3d1c7e62705f64188da88d202db4cd
          path: .uquant-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.11.33"
      - run: uv sync --frozen --extra dev
      - run: uv run python scripts/_temporary_decision_recovery_patch.py
      - run: uv run ruff check --fix src/firmquant/strategy/adapter.py src/firmquant/application/production_services.py tests/unit/application/test_production_services_acceptance.py tests/fixtures/uquant_parity.py tests/integration/test_uquant_parity.py
      - run: uv run ruff format src/firmquant/strategy/adapter.py src/firmquant/application/production_services.py tests/unit/application/test_production_services_acceptance.py tests/fixtures/uquant_parity.py tests/integration/test_uquant_parity.py
      - run: uv run mypy src scripts
      - run: uv run pytest tests/unit/application/test_production_services_acceptance.py -q --no-cov
      - env:
          FIRMQUANT_UQUANT_SOURCE_CHECKOUT: ${{ github.workspace }}/.uquant-source
        run: uv run pytest tests/integration/test_uquant_parity.py -q --no-cov
      - shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/firmquant/strategy/adapter.py src/firmquant/application/production_services.py tests/unit/application/test_production_services_acceptance.py
          git commit -m "fix: recover durable decision account state"
          git push origin HEAD:${GITHUB_REF_NAME}
