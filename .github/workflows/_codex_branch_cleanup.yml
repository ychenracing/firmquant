name: Clean temporary account authority branches

on:
  push:
    branches:
      - codex/account-authority-reconciliation
    paths:
      - .github/workflows/_codex_branch_cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Delete temporary remote branches
        run: |
          git push origin --delete \
            codex/account-authority-reconciliation-coverage \
            codex/account-authority-reconciliation-coverage-final \
            codex/account-authority-reconciliation-coverage-run \
            codex/account-authority-reconciliation-coverage-run2 \
            codex/account-authority-reconciliation-coverage-scratch \
            codex/account-authority-reconciliation-verify-temp
      - name: Remove cleanup workflow and commit
        run: |
          rm .github/workflows/_codex_branch_cleanup.yml
          git config user.name "firmquant-agent"
          git config user.email "firmquant-agent@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove temporary branch cleanup"
          git push origin HEAD:codex/account-authority-reconciliation
