name: Replay synthetic fact fix

on:
  push:
    branches:
      - codex/execution-evidence-readiness
    paths:
      - scripts/fix_replay_synthetic_facts.py
      - .github/workflows/replay-synthetic-fact-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/execution-evidence-readiness
          clean: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: "0.11.33"
      - run: python scripts/fix_replay_synthetic_facts.py
      - run: uv sync --frozen --extra dev
      - run: |
          uv run ruff check --fix src/firmquant/execution/replay_runner.py
          uv run ruff format src/firmquant/execution/replay_runner.py
      - run: |
          git config user.name "firmquant-bot"
          git config user.email "firmquant-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Limit replay broker facts to submitted orders"
          git push origin HEAD:codex/execution-evidence-readiness
