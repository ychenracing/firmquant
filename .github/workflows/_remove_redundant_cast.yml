name: remove-redundant-cast

on:
  push:
    branches:
      - codex/account-authority-reconciliation
    paths:
      - .github/workflows/_remove_redundant_cast.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/account-authority-reconciliation
          fetch-depth: 0
      - name: Apply exact patch
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/firmquant/application/production_services.py")
          text = path.read_text(encoding="utf-8")
          old = "return cast(ReconciliationReceipt, result.receipt), snapshot, result.account"
          new = "return result.receipt, snapshot, result.account"
          if text.count(old) != 1:
              raise SystemExit("target drifted")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          Path(".github/workflows/_remove_redundant_cast.yml").unlink()
      - name: Commit and self-delete
        run: |
          git config user.name firmquant-agent
          git config user.email firmquant-agent@users.noreply.github.com
          git add -A
          git commit -m "fix: remove redundant reconciliation receipt cast"
          git push origin HEAD:codex/account-authority-reconciliation
