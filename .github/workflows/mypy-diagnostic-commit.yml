name: Mypy diagnostic commit

on:
  pull_request:

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'codex/execution-evidence-readiness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/execution-evidence-readiness
          clean: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: "0.11.33"
      - name: Capture diagnostics
        shell: bash
        run: |
          uv sync --frozen --extra dev
          set +e
          uv run mypy src scripts > mypy-diagnostic.txt 2>&1
          code=$?
          set -e
          printf '\nMYEXIT=%s\n' "$code" >> mypy-diagnostic.txt
          rm .github/workflows/mypy-diagnostic-commit.yml
          git config user.name "firmquant-bot"
          git config user.email "firmquant-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Expose strict mypy diagnostics"
          git push origin HEAD:codex/execution-evidence-readiness
