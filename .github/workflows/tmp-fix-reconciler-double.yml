name: tmp-fix-reconciler-double
on:
  push:
    branches:
      - codex/account-authority-reconciliation
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Upgrade acceptance reconciler double
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/unit/application/test_production_services_acceptance.py')
          text = path.read_text(encoding='utf-8')
          old = '''class PassingReconciler:\n    def __init__(self) -> None:\n        self.facts: list[object] = []\n\n    def run(self, kind, facts):\n        self.facts.append(facts)\n        return SimpleNamespace(\n            reconciliation_id="recon_" + "a" * 64,\n            kind=kind,\n            passed=True,\n            blockers=(),\n        )\n'''
          new = '''class PassingReconciler:\n    def __init__(self) -> None:\n        self.facts: list[object] = []\n\n    def evaluate(self, kind, facts):\n        self.facts.append(facts)\n        return SimpleNamespace(\n            reconciliation_id="recon_" + "a" * 64,\n            kind=kind,\n            passed=True,\n            blockers=(),\n        )\n\n    def commit(self, _receipt, *, broker_snapshot_sha256):\n        assert len(broker_snapshot_sha256) == 64\n'''
          if text.count(old) != 1:
              raise SystemExit('expected PassingReconciler anchor exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git rm .github/workflows/tmp-fix-reconciler-double.yml
          git config user.name firmquant-agent
          git config user.email firmquant-agent@users.noreply.github.com
          git add tests/unit/application/test_production_services_acceptance.py
          git commit -m "test: align production reconciler double with finalization"
          git push origin HEAD:codex/account-authority-reconciliation
