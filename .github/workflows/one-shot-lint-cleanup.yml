name: One-shot lint cleanup

on:
  push:
    branches:
      - codex/production-live-hardening-20260826

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'fix(auto): lint cleanup') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - name: Apply deterministic cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          orders = Path("src/firmquant/domain/orders.py")
          text = orders.read_text(encoding="utf-8")
          triple = "    SubmitNotAccepted,\n    SubmitNotAccepted,\n    SubmitNotAccepted,\n"
          if triple in text:
              text = text.replace(triple, "    SubmitNotAccepted,\n", 1)
          orders.write_text(text, encoding="utf-8", newline="\n")

          live = Path("tests/unit/execution/test_live_controller.py")
          text = live.read_text(encoding="utf-8")
          text = text.replace("from firmquant.domain.values import Shares\n", "")
          live.write_text(text, encoding="utf-8", newline="\n")

          recovery = Path("tests/unit/persistence/test_production_recovery.py")
          text = recovery.read_text(encoding="utf-8")
          text = text.replace("  # noqa: SLF001", "")
          recovery.write_text(text, encoding="utf-8", newline="\n")
          PY
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/firmquant/domain/orders.py tests/unit/execution/test_live_controller.py tests/unit/persistence/test_production_recovery.py
          git commit -m "fix(auto): lint cleanup after live hardening"
          git push origin HEAD:${GITHUB_REF_NAME}
