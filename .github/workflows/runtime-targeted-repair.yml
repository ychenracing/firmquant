name: Runtime Targeted Repair

on:
  push:
    branches:
      - codex/runtime-time-health

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'ychenracing/firmquant'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/runtime-time-health
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.33'
      - run: uv sync --frozen --extra dev
      - name: Repair mode-scoped doctor and clock-authority test facts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          fixture = Path('tests/fixtures/risk_cases.py')
          text = fixture.read_text(encoding='utf-8')
          text = text.replace('        max_replacements=2,\n', '')
          text = text.replace('        replacement_count=0,\n', '')
          fixture.write_text(text, encoding='utf-8')

          gate_test = Path('tests/unit/risk/test_gate.py')
          text = gate_test.read_text(encoding='utf-8')
          obsolete = '''        (\n            {"replacement_count": 2},\n            GateAction.BLOCK,\n            "REPLACEMENT_LIMIT",\n        ),\n'''
          if text.count(obsolete) != 1:
              raise SystemExit(f'obsolete replacement test shape changed: {text.count(obsolete)}')
          gate_test.write_text(text.replace(obsolete, '', 1), encoding='utf-8')

          heartbeat_test = Path('tests/unit/application/test_runtime_health_status.py')
          text = heartbeat_test.read_text(encoding='utf-8')
          marker = '        writer.database.write(\n            """\n            INSERT INTO production_heartbeat('
          replacement = '        with writer.database.transaction():\n            writer.database.write(\n                """\n                INSERT INTO production_heartbeat('
          if text.count(marker) != 1:
              raise SystemExit(f'heartbeat insert shape changed: {text.count(marker)}')
          heartbeat_test.write_text(text.replace(marker, replacement, 1), encoding='utf-8')

          capability_test = Path('tests/unit/risk/test_capability.py')
          text = capability_test.read_text(encoding='utf-8')
          import_anchor = 'from firmquant.risk.kill_switch import KillSwitch\n'
          import_replacement = (
              import_anchor
              + 'from firmquant.scheduling.clock import ClockGuard, ClockObservation\n'
          )
          if text.count(import_anchor) != 1:
              raise SystemExit('capability clock import anchor changed')
          text = text.replace(import_anchor, import_replacement, 1)
          context_tail = '''        cash_and_positions_safe=True,\n        frequency_within_limits=True,\n    )\n'''
          context_replacement = '''        cash_and_positions_safe=True,\n        frequency_within_limits=True,\n        clock_receipt=ClockGuard(max_drift=timedelta(seconds=2)).verify(\n            ClockObservation(\n                system_time=NOW,\n                reference_time=NOW,\n                local_timezone="Asia/Shanghai",\n            )\n        ),\n    )\n'''
          if text.count(context_tail) != 1:
              raise SystemExit(f'capability healthy context tail changed: {text.count(context_tail)}')
          capability_test.write_text(text.replace(context_tail, context_replacement, 1), encoding='utf-8')

          daemon_test = Path('tests/unit/application/test_production_daemon.py')
          text = daemon_test.read_text(encoding='utf-8')
          init_anchor = '        self.value = datetime(2026, 8, 25, 1, 30, tzinfo=UTC)\n'
          if text.count(init_anchor) != 1:
              raise SystemExit('daemon fake clock init anchor changed')
          text = text.replace(init_anchor, init_anchor + '        self.elapsed = 0.0\n', 1)
          sleep_old = '''    def sleep(self, seconds: float) -> None:\n        self.value += timedelta(seconds=seconds)\n'''
          sleep_new = '''    def sleep(self, seconds: float) -> None:\n        self.value += timedelta(seconds=seconds)\n        self.elapsed += seconds\n\n    def monotonic(self) -> float:\n        return self.elapsed\n'''
          if text.count(sleep_old) != 1:
              raise SystemExit('daemon fake clock sleep block changed')
          text = text.replace(sleep_old, sleep_new, 1)
          daemon_anchor = '            clock=clock,\n            sleep=clock.sleep,\n'
          if text.count(daemon_anchor) != 3:
              raise SystemExit(f'daemon construction clock anchor changed: {text.count(daemon_anchor)}')
          text = text.replace(
              daemon_anchor,
              '            clock=clock,\n            monotonic_clock=clock.monotonic,\n            sleep=clock.sleep,\n',
          )
          daemon_test.write_text(text, encoding='utf-8')

          path = Path('src/firmquant/observability/health.py')
          text = path.read_text(encoding='utf-8')
          old = '''        def readonly_account() -> CheckEvidence:\n            if broker is None:\n                return _evidence(False, "READONLY_ACCOUNT_UNAVAILABLE", configured=False)\n            if production_mode and safety_manifest is None:\n                return _evidence(False, "XTQUANT_SAFETY_MANIFEST_UNAVAILABLE", configured=True)\n            probe = safety_manifest.probe_symbol if safety_manifest is not None else Symbol.parse("000001.SZ")\n            with _broker_read_session(broker):\n                account = broker.query_account()\n                positions = broker.query_positions()\n                orders = broker.query_orders()\n                fills = broker.query_fills()\n                market_status = broker.query_market_status()\n                instrument = broker.query_instrument(probe)\n                quote = broker.query_quote(probe)\n                health = broker.health()\n            alias_configured = settings.broker.account_alias is not None or not production_mode\n            manifest_verified = safety_manifest is not None or not production_mode\n            passed = (\n                isinstance(account, BrokerAccountFact)\n                and account.account_type is AccountType.CASH\n                and account.available_cash.value >= 0\n                and isinstance(positions, tuple)\n                and all(isinstance(item, BrokerPositionFact) for item in positions)\n                and isinstance(orders, tuple)\n                and all(isinstance(item, BrokerOrderFact) for item in orders)\n                and isinstance(fills, tuple)\n                and all(isinstance(item, BrokerFillFact) for item in fills)\n                and isinstance(market_status, MarketSessionStatus)\n                and isinstance(instrument, InstrumentFact)\n                and isinstance(quote, QuoteFact)\n                and alias_configured\n                and manifest_verified\n                and health.connected\n                and health.read_healthy\n            )\n            return _evidence(\n                passed,\n                "READONLY_ACCOUNT_VERIFIED" if passed else "READONLY_ACCOUNT_INVALID",\n                configured=True,\n                account_type=account.account_type.value,\n                cash_nonnegative=account.available_cash.value >= 0,\n                position_count=len(positions),\n                order_count=len(orders),\n                fill_count=len(fills),\n                market_status=market_status.value,\n                instrument_symbol=instrument.symbol.canonical,\n                quote_symbol=quote.symbol.canonical,\n                account_alias_configured=alias_configured,\n                safety_manifest_verified=manifest_verified,\n                real_order_calls=0,\n            )\n'''
          new = '''        def readonly_account() -> CheckEvidence:\n            if broker is None:\n                return _evidence(False, "READONLY_ACCOUNT_UNAVAILABLE", configured=False)\n            if not production_mode:\n                with _broker_read_session(broker):\n                    account = broker.query_account()\n                passed = (\n                    isinstance(account, BrokerAccountFact)\n                    and account.account_type is AccountType.CASH\n                    and account.available_cash.value >= 0\n                )\n                return _evidence(\n                    passed,\n                    "READONLY_ACCOUNT_VERIFIED" if passed else "READONLY_ACCOUNT_INVALID",\n                    configured=True,\n                    account_type=account.account_type.value,\n                    cash_nonnegative=account.available_cash.value >= 0,\n                )\n            if safety_manifest is None:\n                return _evidence(False, "XTQUANT_SAFETY_MANIFEST_UNAVAILABLE", configured=True)\n            probe = safety_manifest.probe_symbol\n            with _broker_read_session(broker):\n                account = broker.query_account()\n                positions = broker.query_positions()\n                orders = broker.query_orders()\n                fills = broker.query_fills()\n                market_status = broker.query_market_status()\n                instrument = broker.query_instrument(probe)\n                quote = broker.query_quote(probe)\n                health = broker.health()\n            alias_configured = settings.broker.account_alias is not None\n            passed = (\n                isinstance(account, BrokerAccountFact)\n                and account.account_type is AccountType.CASH\n                and account.available_cash.value >= 0\n                and isinstance(positions, tuple)\n                and all(isinstance(item, BrokerPositionFact) for item in positions)\n                and isinstance(orders, tuple)\n                and all(isinstance(item, BrokerOrderFact) for item in orders)\n                and isinstance(fills, tuple)\n                and all(isinstance(item, BrokerFillFact) for item in fills)\n                and isinstance(market_status, MarketSessionStatus)\n                and isinstance(instrument, InstrumentFact)\n                and isinstance(quote, QuoteFact)\n                and alias_configured\n                and health.connected\n                and health.read_healthy\n            )\n            return _evidence(\n                passed,\n                "READONLY_ACCOUNT_VERIFIED" if passed else "READONLY_ACCOUNT_INVALID",\n                configured=True,\n                account_type=account.account_type.value,\n                cash_nonnegative=account.available_cash.value >= 0,\n                position_count=len(positions),\n                order_count=len(orders),\n                fill_count=len(fills),\n                market_status=market_status.value,\n                instrument_symbol=instrument.symbol.canonical,\n                quote_symbol=quote.symbol.canonical,\n                account_alias_configured=alias_configured,\n                safety_manifest_verified=True,\n                real_order_calls=0,\n            )\n'''
          if text.count(old) != 1:
              raise SystemExit(f'doctor readonly-account block mismatch: {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          uv run ruff check --fix \
            src/firmquant/observability/health.py \
            tests/fixtures/risk_cases.py \
            tests/unit/risk/test_gate.py \
            tests/unit/risk/test_capability.py \
            tests/unit/application/test_production_daemon.py \
            tests/unit/application/test_runtime_health_status.py
          uv run ruff format \
            src/firmquant/observability/health.py \
            tests/fixtures/risk_cases.py \
            tests/unit/risk/test_gate.py \
            tests/unit/risk/test_capability.py \
            tests/unit/application/test_production_daemon.py \
            tests/unit/application/test_runtime_health_status.py
          uv run mypy src scripts
          uv run pytest \
            tests/unit/observability/test_doctor.py \
            tests/unit/risk/test_gate.py \
            tests/unit/risk/test_capability.py \
            tests/unit/application/test_production_daemon.py \
            tests/unit/application/test_production_composition.py \
            tests/unit/application/test_production_services_acceptance.py \
            tests/integration/test_runtime_time_health_contract.py \
            tests/unit/execution/test_runtime_time_health_execution.py \
            tests/unit/application/test_runtime_health_status.py \
            -q
          rm .github/workflows/runtime-targeted-repair.yml
      - name: Commit focused repair
        shell: bash
        run: |
          git config user.name 'firmquant-runtime-safety-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/firmquant/observability/health.py \
                  tests/fixtures/risk_cases.py \
                  tests/unit/risk/test_gate.py \
                  tests/unit/risk/test_capability.py \
                  tests/unit/application/test_production_daemon.py \
                  tests/unit/application/test_runtime_health_status.py \
                  .github/workflows/runtime-targeted-repair.yml
          git commit -m 'Repair runtime doctor and clock authority contracts'
          git push origin HEAD:codex/runtime-time-health
