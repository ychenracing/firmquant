name: reviewed-adjustment-wiring

on:
  push:
    branches:
      - codex/account-authority-reconciliation
    paths:
      - .github/workflows/_reviewed_adjustment_wiring.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/account-authority-reconciliation
          fetch-depth: 0
      - name: Apply exact source patch
        run: python scripts/_apply_reviewed_adjustment_wiring.py
      - name: Commit and self-delete
        run: |
          rm scripts/_apply_reviewed_adjustment_wiring.py .github/workflows/_reviewed_adjustment_wiring.yml
          git config user.name firmquant-agent
          git config user.email firmquant-agent@users.noreply.github.com
          git add -A
          git commit -m "feat: wire exact reviewed account adjustments"
          git push origin HEAD:codex/account-authority-reconciliation
