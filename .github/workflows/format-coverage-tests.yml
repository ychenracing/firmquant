name: Format coverage tests

on:
  pull_request:

permissions:
  contents: write

env:
  FIRMQ_CI: "1"
  FIRMQ_MODE: PAPER
  FIRMQ_LIVE_TRADING_ENABLED: "false"
  UV_FROZEN: "1"

jobs:
  format:
    if: github.head_ref == 'codex/execution-evidence-readiness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          clean: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: "0.11.33"
      - name: Correct expectations, format, and verify branch tests
        run: |
          uv sync --frozen --extra dev
          python - <<'PY'
          from pathlib import Path

          runner_path = Path("tests/unit/execution/test_replay_runner_branches.py")
          runner_text = runner_path.read_text(encoding="utf-8")
          replacements = {
              'assert normal.limit_up == Decimal("11.66")': 'assert normal.limit_up == Decimal("11.55")',
              'assert normal.limit_down == Decimal("9.54")': 'assert normal.limit_down == Decimal("9.45")',
              'assert facts.instruments[0].symbol.canonical == "600000.SH"': 'assert facts.instruments[0].symbol.canonical == "sh600000"',
              'assert runner._plan_symbols(valid) == ("300001.SZ", "600000.SH")': 'assert runner._plan_symbols(valid) == ("sh600000", "sz300001")',
          }
          for old, new in replacements.items():
              if old not in runner_text:
                  raise SystemExit(f"runner test target not found: {old}")
              runner_text = runner_text.replace(old, new, 1)
          runner_path.write_text(runner_text, encoding="utf-8")

          replay_path = Path("tests/unit/execution/test_execution_replay_branches.py")
          replay_text = replay_path.read_text(encoding="utf-8")
          if 'bar = _bar(volume=105, close="11")' not in replay_text:
              raise SystemExit("high/close fixture target not found")
          replay_text = replay_text.replace(
              'bar = _bar(volume=105, close="11")',
              'bar = _bar(volume=105, high="11", close="11")',
              1,
          )
          if replay_text.count('_bar(close="9")') < 2:
              raise SystemExit("low/close fixture targets not found")
          replay_text = replay_text.replace('_bar(close="9")', '_bar(low="9", close="9")')
          replay_path.write_text(replay_text, encoding="utf-8")
          PY
          uv run ruff format tests/unit/execution/test_execution_replay_branches.py tests/unit/execution/test_replay_runner_branches.py
          uv run ruff check tests/unit/execution/test_execution_replay_branches.py tests/unit/execution/test_replay_runner_branches.py
          uv run pytest tests/unit/execution/test_execution_replay_branches.py tests/unit/execution/test_replay_runner_branches.py -q
      - name: Commit verified formatted tests
        run: |
          git rm .github/workflows/format-coverage-tests.yml
          git config user.name firmquant-bot
          git config user.email firmquant-bot@users.noreply.github.com
          git add tests/unit/execution/test_execution_replay_branches.py tests/unit/execution/test_replay_runner_branches.py
          git diff --cached --check
          git commit -m "Format and verify replay branch coverage tests"
          git push origin HEAD:codex/execution-evidence-readiness
