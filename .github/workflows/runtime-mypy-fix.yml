name: Runtime Mypy Fix

on:
  push:
    branches:
      - codex/runtime-time-health

permissions:
  contents: write

jobs:
  fix:
    if: github.repository == 'ychenracing/firmquant'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/runtime-time-health
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.33'
      - run: uv sync --frozen --extra dev
      - name: Remove duplicate wiring and repair strict types
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # production_services: earlier exact transformations were applied more than once.
          path = Path('src/firmquant/application/production_services.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    reconciliation: ReconciliationReceipt\n' * 3,
              '    reconciliation: ReconciliationReceipt\n',
          )
          text = text.replace(
              '        self._active_execution_deadlines: ExecutionDeadlines | None = None\n' * 3,
              '        self._active_execution_deadlines: ExecutionDeadlines | None = None\n',
          )
          first = text.find('\n    def _monotonic(self) -> float:')
          second = text.find('\n    def _monotonic(self) -> float:', first + 1)
          transition = text.find('\n    def _transition(', second + 1)
          if first < 0 or second < 0 or transition < 0:
              raise SystemExit('production_services duplicate method block shape changed')
          if text.find('\n    def _monotonic(self) -> float:', second + 1, transition) < 0:
              raise SystemExit('expected triplicated production_services helper block')
          text = text[:second] + text[transition:]
          path.write_text(text, encoding='utf-8')

          # ProductionXtQuantBroker.load_sdk is a classmethod that returns cls at runtime;
          # the base annotation is intentionally wider, so narrow at this construction seam.
          path = Path('src/firmquant/broker/production_factory.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('from typing import Protocol\n', 'from typing import Protocol, cast\n')
          old = '''    return ProductionXtQuantBroker.load_sdk(\n        userdata_path=userdata,\n        session_id=session_id,\n        account_id=account_id,\n        clock=clock,\n        importer=importer,\n        safety_facts=safety,\n    )\n'''
          new = '''    return cast(\n        ProductionXtQuantBroker,\n        ProductionXtQuantBroker.load_sdk(\n            userdata_path=userdata,\n            session_id=session_id,\n            account_id=account_id,\n            clock=clock,\n            importer=importer,\n            safety_facts=safety,\n        ),\n    )\n'''
          if text.count(old) != 1:
              raise SystemExit('production factory load_sdk block changed')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Avoid cross-loop mypy narrowing of the reused loop variable.
          path = Path('src/firmquant/application/production_daemon.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('''        for label, value in (\n            ("process id", self.process_id),\n            ("writer generation", self.writer_generation),\n            ("pending events", self.pending_events),\n            ("processed events", self.processed_events),\n            ("decisions", self.decisions),\n            ("executions", self.executions),\n            ("EOD", self.eod),\n        ):\n            if isinstance(value, bool) or not isinstance(value, int) or value < 0:\n                raise ValueError(f"heartbeat {label} must be a nonnegative integer")\n        for label, value in (\n            ("broker connected", self.broker_connected),\n            ("broker read health", self.broker_read_healthy),\n            ("broker write health", self.broker_write_healthy),\n        ):\n            if type(value) is not bool:\n                raise TypeError(f"heartbeat {label} must be bool")\n''', '''        for label, integer_value in (\n            ("process id", self.process_id),\n            ("writer generation", self.writer_generation),\n            ("pending events", self.pending_events),\n            ("processed events", self.processed_events),\n            ("decisions", self.decisions),\n            ("executions", self.executions),\n            ("EOD", self.eod),\n        ):\n            if (\n                isinstance(integer_value, bool)\n                or not isinstance(integer_value, int)\n                or integer_value < 0\n            ):\n                raise ValueError(f"heartbeat {label} must be a nonnegative integer")\n        for label, boolean_value in (\n            ("broker connected", self.broker_connected),\n            ("broker read health", self.broker_read_healthy),\n            ("broker write health", self.broker_write_healthy),\n        ):\n            if type(boolean_value) is not bool:\n                raise TypeError(f"heartbeat {label} must be bool")\n''')
          text = text.replace('''        for label, value in (\n            ("last broker event", self.last_broker_event),\n            ("last quote", self.last_quote),\n            ("last reconciliation", self.last_reconciliation),\n            ("last decision", self.last_decision),\n            ("last execution", self.last_execution),\n        ):\n            if value is not None and (\n                not isinstance(value, datetime) or value.tzinfo is None or value.utcoffset() is None\n            ):\n                raise ValueError(f"heartbeat {label} must be timezone-aware or null")\n''', '''        for label, timestamp_value in (\n            ("last broker event", self.last_broker_event),\n            ("last quote", self.last_quote),\n            ("last reconciliation", self.last_reconciliation),\n            ("last decision", self.last_decision),\n            ("last execution", self.last_execution),\n        ):\n            if timestamp_value is not None and (\n                not isinstance(timestamp_value, datetime)\n                or timestamp_value.tzinfo is None\n                or timestamp_value.utcoffset() is None\n            ):\n                raise ValueError(f"heartbeat {label} must be timezone-aware or null")\n''')
          path.write_text(text, encoding='utf-8')

          # Narrow the operator doctor port to the structural read-only protocol.
          path = Path('src/firmquant/application/composition.py')
          text = path.read_text(encoding='utf-8')
          anchor = 'from firmquant.observability.reports import DailyReportRenderer, DatabaseDailyReportBuilder\n'
          replacement = (
              'from firmquant.observability.health import ReadOnlyDoctorBroker\n'
              + anchor
          )
          if 'from firmquant.observability.health import ReadOnlyDoctorBroker\n' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('composition observability import anchor changed')
              text = text.replace(anchor, replacement, 1)
          text = text.replace('    def doctor_broker(self) -> object:\n', '    def doctor_broker(self) -> ReadOnlyDoctorBroker:\n')
          text = text.replace(
              '        return self._gateway(settings, account)\n\n    def _bootstrap_data_identity(',
              '        return cast(ReadOnlyDoctorBroker, self._gateway(settings, account))\n\n    def _bootstrap_data_identity(',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
          uv run ruff check --fix \
            src/firmquant/application/production_services.py \
            src/firmquant/application/production_daemon.py \
            src/firmquant/application/composition.py \
            src/firmquant/broker/production_factory.py
          uv run ruff format \
            src/firmquant/application/production_services.py \
            src/firmquant/application/production_daemon.py \
            src/firmquant/application/composition.py \
            src/firmquant/broker/production_factory.py
          uv run mypy src scripts
          rm .github/workflows/runtime-mypy-fix.yml
      - name: Commit type cleanup
        shell: bash
        run: |
          git config user.name 'firmquant-runtime-safety-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/firmquant/application/production_services.py \
                  src/firmquant/application/production_daemon.py \
                  src/firmquant/application/composition.py \
                  src/firmquant/broker/production_factory.py \
                  .github/workflows/runtime-mypy-fix.yml
          git commit -m 'Clean runtime authority type wiring'
          git push origin HEAD:codex/runtime-time-health
