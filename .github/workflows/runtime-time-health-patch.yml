name: Runtime Time Health Patch

on:
  push:
    branches:
      - codex/runtime-time-health

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'ychenracing/firmquant'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/runtime-time-health
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact runtime safety transformations
        run: |
          python scripts/runtime_time_health_patch.py
          python scripts/runtime_time_health_patch2.py
          python scripts/runtime_time_health_patch3.py
          python - <<'PY'
          from pathlib import Path
          path = Path('src/firmquant/observability/health.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'from datetime import UTC, datetime\n',
              'from datetime import UTC, datetime, timedelta\n',
          )
          text = text.replace(
              'max_drift=timedelta(seconds=float(maximum_clock_drift_seconds))',
              'max_drift=timedelta(milliseconds=int(maximum_clock_drift_seconds * 1000))',
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit transformed files when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No patch changes required.'
            exit 0
          fi
          git config user.name 'firmquant-runtime-safety-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/firmquant/persistence/schema.py \
                  src/firmquant/config.py \
                  src/firmquant/risk/runtime.py \
                  src/firmquant/risk/gate.py \
                  src/firmquant/risk/capability.py \
                  src/firmquant/application/composition.py \
                  src/firmquant/application/operations.py \
                  src/firmquant/application/production_services.py \
                  src/firmquant/application/production_daemon.py \
                  src/firmquant/observability/health.py \
                  src/firmquant/broker/production_smoke.py
          git commit -m 'Wire read-only production diagnostics and smoke'
          git push origin HEAD:codex/runtime-time-health
