name: Runtime Final Targeted Repair

on:
  push:
    branches:
      - codex/runtime-time-health

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'ychenracing/firmquant'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/runtime-time-health
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.33'
      - run: uv sync --frozen --extra dev
      - name: Apply final compatibility repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Heartbeat is production daemon authority. PAPER/REPLAY retain their stored runtime state.
          replace_once(
              'src/firmquant/application/operations.py',
              '''        heartbeat = database.query_one("SELECT * FROM production_heartbeat WHERE singleton_id = 1")\n        heartbeat_age: float | None = None\n        process_health = "NOT_RUNNING"\n        broker_connection = "NOT_RUNNING"\n        broker_read_healthy = False\n        broker_write_healthy = False\n        if heartbeat is None:\n            blockers.add("PROCESS_NOT_RUNNING")\n        else:\n            try:\n                heartbeat_at = datetime.fromisoformat(str(heartbeat["observed_at"]))\n                if heartbeat_at.tzinfo is None or heartbeat_at.utcoffset() is None:\n                    raise ValueError\n                age = now - heartbeat_at\n                heartbeat_age = age.total_seconds()\n                if heartbeat_age < 0:\n                    raise ValueError\n            except ValueError as error:\n                raise OperatorCommandDenied("HEARTBEAT_INVALID") from error\n            broker_connection = "CONNECTED" if int(heartbeat["broker_connected"]) == 1 else "DISCONNECTED"\n            broker_read_healthy = int(heartbeat["broker_read_healthy"]) == 1\n            broker_write_healthy = int(heartbeat["broker_write_healthy"]) == 1\n            if heartbeat_age > 30.0:\n                process_health = "STALE"\n                blockers.add("HEARTBEAT_STALE")\n            else:\n                process_health = "HEALTHY"\n        effective_state = status.state.value if process_health == "HEALTHY" else RuntimeState.HALTED.value\n''',
              '''        production_mode = settings.mode in {Mode.SHADOW, Mode.CANARY, Mode.LIVE}\n        heartbeat = database.query_one("SELECT * FROM production_heartbeat WHERE singleton_id = 1")\n        heartbeat_age: float | None = None\n        process_health = "NOT_APPLICABLE"\n        broker_connection = "NOT_APPLICABLE"\n        broker_read_healthy = False\n        broker_write_healthy = False\n        effective_state = status.state.value\n        if production_mode:\n            process_health = "NOT_RUNNING"\n            broker_connection = "NOT_RUNNING"\n            effective_state = RuntimeState.HALTED.value\n            if heartbeat is None:\n                blockers.add("PROCESS_NOT_RUNNING")\n            else:\n                try:\n                    heartbeat_at = datetime.fromisoformat(str(heartbeat["observed_at"]))\n                    if heartbeat_at.tzinfo is None or heartbeat_at.utcoffset() is None:\n                        raise ValueError\n                    age = now - heartbeat_at\n                    heartbeat_age = age.total_seconds()\n                    if heartbeat_age < 0:\n                        raise ValueError\n                except ValueError as error:\n                    raise OperatorCommandDenied("HEARTBEAT_INVALID") from error\n                broker_connection = (\n                    "CONNECTED" if int(heartbeat["broker_connected"]) == 1 else "DISCONNECTED"\n                )\n                broker_read_healthy = int(heartbeat["broker_read_healthy"]) == 1\n                broker_write_healthy = int(heartbeat["broker_write_healthy"]) == 1\n                if heartbeat_age > 30.0:\n                    process_health = "STALE"\n                    blockers.add("HEARTBEAT_STALE")\n                else:\n                    process_health = "HEALTHY"\n                    effective_state = status.state.value\n''',
              'mode-scoped heartbeat authority',
          )
          replace_once(
              'src/firmquant/application/operations.py',
              '''            "last_reconciliation": (None if heartbeat is None else heartbeat["last_reconciliation"]),\n''',
              '''            "last_reconciliation": (\n                None\n                if heartbeat is None and latest_reconciliation is None\n                else latest_reconciliation["completed_at"]\n                if heartbeat is None\n                else heartbeat["last_reconciliation"]\n            ),\n''',
              'status reconciliation fallback',
          )

          # A CANARY READY fixture must include a fresh daemon heartbeat.
          replace_once(
              'tests/integration/test_cli_operations.py',
              '''            database.write(\n                """\n                INSERT INTO runtime_state(\n                    singleton_id, mode, state, revision, reason, blockers_json, updated_at\n                ) VALUES (1, 'CANARY', 'READY', 1, 'startup reconciliation passed', '[]', ?)\n                """,\n                (NOW.isoformat(),),\n            )\n''',
              '''            database.write(\n                """\n                INSERT INTO runtime_state(\n                    singleton_id, mode, state, revision, reason, blockers_json, updated_at\n                ) VALUES (1, 'CANARY', 'READY', 1, 'startup reconciliation passed', '[]', ?)\n                """,\n                (NOW.isoformat(),),\n            )\n            database.write(\n                """\n                INSERT INTO production_heartbeat(\n                    singleton_id, mode, runtime_state, observed_at, host_hash, process_id,\n                    writer_generation, broker_connected, broker_read_healthy, broker_write_healthy,\n                    pending_events, last_broker_event, last_quote, last_reconciliation,\n                    last_decision, last_execution, control_request_state, processed_events,\n                    decisions, executions, eod\n                ) VALUES (1, 'CANARY', 'READY', ?, ?, 12345, 1, 1, 1, 1, 0, NULL, NULL, ?,\n                          NULL, NULL, 'IDLE', 0, 0, 0, 0)\n                """,\n                (NOW.isoformat(), "h" * 64, NOW.isoformat()),\n            )\n''',
              'live readiness heartbeat fixture',
          )

          # Existing live-controller tests need the now-required clock evidence.
          path = Path('tests/unit/execution/test_live_controller.py')
          text = path.read_text(encoding='utf-8')
          import_anchor = 'from firmquant.risk.gate import GateAction, GateDecision\n'
          if text.count(import_anchor) != 1:
              raise SystemExit('live controller clock import anchor changed')
          text = text.replace(
              import_anchor,
              import_anchor + 'from firmquant.scheduling.clock import ClockGuard, ClockObservation\n',
              1,
          )
          context_tail = '''            cash_and_positions_safe=True,\n            frequency_within_limits=True,\n        )\n'''
          context_new = '''            cash_and_positions_safe=True,\n            frequency_within_limits=True,\n            clock_receipt=ClockGuard(max_drift=timedelta(seconds=2)).verify(\n                ClockObservation(\n                    system_time=clock(),\n                    reference_time=clock(),\n                    local_timezone="Asia/Shanghai",\n                )\n            ),\n        )\n'''
          if text.count(context_tail) != 1:
              raise SystemExit(f'live controller context tail changed: {text.count(context_tail)}')
          path.write_text(text.replace(context_tail, context_new, 1), encoding='utf-8')

          # Private branch test follows the monotonic API rather than the removed wall timestamp.
          replace_once(
              'tests/unit/execution/test_live_controller_branches.py',
              '            submitted_at=NOW,\n',
              '            submitted_monotonic=clock.monotonic(),\n',
              'finish-open-order monotonic test parameter',
          )

          # Production service branch fixtures must supply complete new authority facts.
          replace_once(
              'tests/unit/application/test_production_services_branches.py',
              '''            ps.ProductionHeartbeat(\n                mode=Mode.SHADOW,\n                observed_at=NOW,\n                writer_generation=hooks._writer.generation,\n                pending_events=0,\n                processed_events=0,\n                decisions=0,\n                executions=0,\n                eod=0,\n            )\n''',
              '''            ps.ProductionHeartbeat(\n                mode=Mode.SHADOW,\n                runtime_state=hooks.status.state,\n                observed_at=NOW,\n                host_hash=hooks._writer.host_hash,\n                process_id=hooks._writer.process_id,\n                writer_generation=hooks._writer.generation,\n                broker_connected=True,\n                broker_read_healthy=True,\n                broker_write_healthy=True,\n                pending_events=0,\n                last_broker_event=None,\n                last_quote=None,\n                last_reconciliation=None,\n                last_decision=None,\n                last_execution=None,\n                control_request_state="IDLE",\n                processed_events=0,\n                decisions=0,\n                executions=0,\n                eod=0,\n            )\n''',
              'expanded production heartbeat branch fixture',
          )
          replace_once(
              'tests/unit/application/test_production_services_branches.py',
              '''        authorities = ps._ExecutionAuthorities(\n            plan=plan,\n            facts=facts,\n            decision=decision,\n            planned={planned.uquant_order_id: planned},\n        )\n''',
              '''        authorities = ps._ExecutionAuthorities(\n            plan=plan,\n            facts=facts,\n            decision=decision,\n            planned={planned.uquant_order_id: planned},\n            reconciliation=SimpleNamespace(\n                reconciliation_id="recon_" + "2" * 64,\n                passed=True,\n                blockers=(),\n            ),\n        )\n''',
              'execution authority reconciliation fixture',
          )
          branch_path = Path('tests/unit/application/test_production_services_branches.py')
          text = branch_path.read_text(encoding='utf-8')
          live_call = '        assert hooks._execute(base.EXECUTION_SESSION) == 1\n'
          unsafe_call = '        with pytest.raises(ps.ProductionServicesUnavailable, match="SAFETY_FAILURE"):\n            hooks._execute(base.EXECUTION_SESSION)\n'
          if text.count(live_call) != 1 or text.count(unsafe_call) != 1:
              raise SystemExit('production services execute branch call shape changed')
          text = text.replace(
              live_call,
              '        hooks._active_execution_deadlines = ps.ExecutionDeadlines(60.0, 90.0, 120.0)\n' + live_call,
              1,
          )
          text = text.replace(
              unsafe_call,
              '        hooks._active_execution_deadlines = ps.ExecutionDeadlines(60.0, 90.0, 120.0)\n' + unsafe_call,
              1,
          )
          branch_path.write_text(text, encoding='utf-8')

          # New explicit SDK code is the stable production failure contract.
          replace_once(
              'tests/unit/broker/test_production_factory_branches.py',
              '        with pytest.raises(BrokerDependencyMissing, match="SDK modules"):\n',
              '        with pytest.raises(BrokerDependencyMissing, match="XTQUANT_SDK_UNAVAILABLE"):\n',
              'production SDK failure code assertion',
          )

          # Schema migration tests follow the central schema version after heartbeat migration.
          replace_once(
              'tests/unit/persistence/test_account_authority_schema_migration.py',
              '''        assert CURRENT_SCHEMA_VERSION == 3\n        assert database.scalar("SELECT max(version) FROM schema_migrations") == 3\n''',
              '''        assert CURRENT_SCHEMA_VERSION >= 4\n        assert database.scalar("SELECT max(version) FROM schema_migrations") == CURRENT_SCHEMA_VERSION\n''',
              'account authority current schema assertion',
          )
          db_path = Path('tests/unit/persistence/test_database.py')
          text = db_path.read_text(encoding='utf-8')
          import_anchor = '''from firmquant.persistence.database import (\n    Database,\n    DatabaseCorrupt,\n    DatabaseUnavailable,\n    TransactionRequired,\n)\n'''
          if text.count(import_anchor) != 1:
              raise SystemExit('database schema import anchor changed')
          text = text.replace(
              import_anchor,
              import_anchor + 'from firmquant.persistence.schema import CURRENT_SCHEMA_VERSION\n',
              1,
          )
          text = text.replace(
              '        assert reader.scalar("SELECT count(*) FROM schema_migrations") == 3\n',
              '        assert reader.scalar("SELECT count(*) FROM schema_migrations") == CURRENT_SCHEMA_VERSION\n',
              1,
          )
          text = text.replace(
              '        assert restored.scalar("SELECT max(version) FROM schema_migrations") == 3\n',
              '        assert restored.scalar("SELECT max(version) FROM schema_migrations") == CURRENT_SCHEMA_VERSION\n',
              1,
          )
          db_path.write_text(text, encoding='utf-8')

          # CLI inventory includes the new read-only production smoke command.
          replace_once(
              'README.md',
              '| `firmquant doctor` | 检查依赖、身份、数据、账本、锁、时钟、SDK、只读连接、合规和实盘锁定 |\n',
              '| `firmquant doctor` | 检查依赖、身份、数据、账本、锁、时钟、SDK、只读连接、合规和实盘锁定 |\n'
              '| `firmquant smoke-readonly` | 在真实部署机读取完整生产 authority surface 并持久化零写调用 receipt |\n',
              'README smoke command inventory',
          )
          PY
          uv run ruff check --fix \
            src/firmquant/application/operations.py \
            tests/integration/test_cli_operations.py \
            tests/unit/execution/test_live_controller.py \
            tests/unit/execution/test_live_controller_branches.py \
            tests/unit/application/test_production_services_branches.py \
            tests/unit/broker/test_production_factory_branches.py \
            tests/unit/persistence/test_account_authority_schema_migration.py \
            tests/unit/persistence/test_database.py
          uv run ruff format \
            src/firmquant/application/operations.py \
            tests/integration/test_cli_operations.py \
            tests/unit/execution/test_live_controller.py \
            tests/unit/execution/test_live_controller_branches.py \
            tests/unit/application/test_production_services_branches.py \
            tests/unit/broker/test_production_factory_branches.py \
            tests/unit/persistence/test_account_authority_schema_migration.py \
            tests/unit/persistence/test_database.py
          uv run mypy src scripts
          uv run pytest \
            tests/integration/test_cli_operations.py \
            tests/unit/application/test_production_services_branches.py \
            tests/unit/broker/test_production_factory_branches.py \
            tests/unit/execution/test_live_controller.py \
            tests/unit/execution/test_live_controller_branches.py \
            tests/unit/persistence/test_account_authority_schema_migration.py \
            tests/unit/persistence/test_database.py \
            tests/unit/test_documented_defaults.py \
            tests/integration/test_runtime_time_health_contract.py \
            tests/unit/execution/test_runtime_time_health_execution.py \
            tests/unit/application/test_runtime_health_status.py \
            -q
          rm .github/workflows/runtime-final-targeted-repair.yml
      - name: Commit targeted repair
        shell: bash
        run: |
          git config user.name 'firmquant-runtime-safety-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/firmquant/application/operations.py \
                  tests/integration/test_cli_operations.py \
                  tests/unit/execution/test_live_controller.py \
                  tests/unit/execution/test_live_controller_branches.py \
                  tests/unit/application/test_production_services_branches.py \
                  tests/unit/broker/test_production_factory_branches.py \
                  tests/unit/persistence/test_account_authority_schema_migration.py \
                  tests/unit/persistence/test_database.py \
                  README.md \
                  .github/workflows/runtime-final-targeted-repair.yml
          git commit -m 'Align runtime safety compatibility contracts'
          git push origin HEAD:codex/runtime-time-health
