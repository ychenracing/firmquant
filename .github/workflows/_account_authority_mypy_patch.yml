name: account-authority-mypy-patch

on:
  push:
    branches:
      - codex/account-authority-reconciliation
    paths:
      - .github/workflows/_account_authority_mypy_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/account-authority-reconciliation
          fetch-depth: 0
      - name: Remove obsolete mypy ignores
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/firmquant/persistence/account_authority.py")
          text = path.read_text(encoding="utf-8")
          marker = "  # type: ignore[index]"
          count = text.count(marker)
          if count != 13:
              raise SystemExit(f"expected 13 obsolete ignores, found {count}")
          path.write_text(text.replace(marker, ""), encoding="utf-8")
          Path(".github/workflows/_account_authority_mypy_patch.yml").unlink()
      - name: Commit exact patch and self-delete
        shell: bash
        run: |
          git config user.name firmquant-agent
          git config user.email firmquant-agent@users.noreply.github.com
          git add src/firmquant/persistence/account_authority.py .github/workflows/_account_authority_mypy_patch.yml
          git commit -m "fix: remove obsolete account authority type ignores"
          git push origin HEAD:codex/account-authority-reconciliation
