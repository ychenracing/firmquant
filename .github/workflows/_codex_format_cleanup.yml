name: Apply isolated format cleanup

on:
  push:
    branches:
      - codex/account-authority-reconciliation
    paths:
      - .github/_codex_format_cleanup.py
      - .github/workflows/_codex_format_cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - run: python .github/_codex_format_cleanup.py
      - run: rm .github/_codex_format_cleanup.py .github/workflows/_codex_format_cleanup.yml
      - run: |
          git diff --check
          git config user.name "firmquant-agent"
          git config user.email "firmquant-agent@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "chore: normalize account authority formatting"
          git push origin HEAD:codex/account-authority-reconciliation
