name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  format-pr-diff:
    if: github.head_ref == 'codex/execution-evidence-readiness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/execution-evidence-readiness
          clean: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: "0.11.33"
      - name: Format only changed Python surface
        run: |
          uv sync --frozen --extra dev
          uv run ruff check --fix \
            src/firmquant/application/execution_evidence.py \
            src/firmquant/application/execution_evidence_runtime.py \
            src/firmquant/application/live_readiness_runtime.py \
            src/firmquant/application/operations.py \
            src/firmquant/application/production_services.py \
            src/firmquant/application/promotion_store.py \
            src/firmquant/application/readiness.py \
            src/firmquant/cli.py \
            src/firmquant/config.py \
            src/firmquant/execution/execution_replay.py \
            src/firmquant/execution/replay_runner.py \
            tests/unit/application/test_execution_evidence.py \
            tests/unit/application/test_live_readiness.py \
            tests/unit/application/test_promotion_store.py \
            tests/unit/execution/test_execution_replay.py
          uv run ruff format \
            src/firmquant/application/execution_evidence.py \
            src/firmquant/application/execution_evidence_runtime.py \
            src/firmquant/application/live_readiness_runtime.py \
            src/firmquant/application/operations.py \
            src/firmquant/application/production_services.py \
            src/firmquant/application/promotion_store.py \
            src/firmquant/application/readiness.py \
            src/firmquant/cli.py \
            src/firmquant/config.py \
            src/firmquant/execution/execution_replay.py \
            src/firmquant/execution/replay_runner.py \
            tests/unit/application/test_execution_evidence.py \
            tests/unit/application/test_live_readiness.py \
            tests/unit/application/test_promotion_store.py \
            tests/unit/execution/test_execution_replay.py
      - name: Restore standard CI and commit
        run: |
          git fetch origin main --depth=1
          git show FETCH_HEAD:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "firmquant-bot"
          git config user.email "firmquant-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Format execution evidence diff"
          git push origin HEAD:codex/execution-evidence-readiness
