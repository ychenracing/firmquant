name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

env:
  FIRMQ_CI: "1"
  FIRMQ_MODE: PAPER
  FIRMQ_LIVE_TRADING_ENABLED: "false"
  UV_FROZEN: "1"

jobs:
  quality:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.11.33"
          enable-cache: true
      - name: Preserve exact uquant source bytes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - name: Sync locked environment
        run: uv sync --frozen --extra dev
      - name: Verify uquant identity
        run: uv run python scripts/verify_source_baseline.py
      - name: Ruff
        run: uv run ruff check .
      - name: Strict mypy
        run: uv run mypy src scripts
      - name: Unit tests
        run: uv run pytest tests/unit -q
      - name: Compile
        run: uv run python -m compileall -q src scripts
      - name: CLI help
        run: uv run python -m firmquant --help

  uquant-parity:
    name: Exact uquant source parity
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout firmquant
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Checkout locked uquant source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ychenracing/uquant
          ref: 105695aacd3d1c7e62705f64188da88d202db4cd
          path: .uquant-source
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.11.33"
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --frozen --extra dev
      - name: Run strategy integration and exact parity
        env:
          FIRMQUANT_UQUANT_SOURCE_CHECKOUT: ${{ github.workspace }}/.uquant-source
        run: >-
          uv run pytest
          tests/unit/strategy
          tests/integration/test_uquant_account_sync.py
          tests/integration/test_uquant_parity.py
          -q
