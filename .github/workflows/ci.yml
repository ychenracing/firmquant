name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: write

env:
  FIRMQ_CI: "1"
  FIRMQ_MODE: PAPER
  FIRMQ_LIVE_TRADING_ENABLED: "false"
  UV_FROZEN: "1"

jobs:
  source-repair:
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/execution-evidence-readiness'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch without destructive cleanup
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/execution-evidence-readiness
          clean: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: "0.11.33"
      - name: Repair source encoding and apply immutable blockers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/firmquant/execution/replay_runner.py')
          raw = path.read_bytes()
          if b'\x00' not in raw:
              raise SystemExit('expected replay runner NUL byte is absent')
          path.write_bytes(raw.replace(b'\x00', b'\\0'))
          PY
          python scripts/add_immutable_planning_blockers.py
      - name: Normalize exact touched surface
        run: |
          uv sync --frozen --extra dev
          uv run ruff check --fix src/firmquant/application/execution_evidence.py src/firmquant/application/promotion_store.py src/firmquant/application/execution_evidence_runtime.py src/firmquant/execution/replay_runner.py tests/unit/application/test_execution_evidence.py
          uv run ruff format src/firmquant/application/execution_evidence.py src/firmquant/application/promotion_store.py src/firmquant/application/execution_evidence_runtime.py src/firmquant/execution/replay_runner.py tests/unit/application/test_execution_evidence.py
      - name: Restore standard CI and commit repair
        shell: bash
        run: |
          git fetch origin main --depth=1
          git show FETCH_HEAD:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "firmquant-bot"
          git config user.email "firmquant-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Repair execution evidence source integrity"
          git push origin HEAD:codex/execution-evidence-readiness

  quality:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.11.33"
          enable-cache: true
      - name: Preserve exact uquant source bytes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - name: Sync locked environment
        run: uv sync --frozen --extra dev
      - name: Verify uquant identity
        run: uv run python scripts/verify_source_baseline.py
      - name: Ruff
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Strict mypy
        run: uv run mypy src scripts
      - name: Repository secret scan
        run: uv run python scripts/secret_scan.py
      - name: Checkout locked uquant source for Linux coverage
        if: runner.os == 'Linux'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ychenracing/uquant
          ref: 105695aacd3d1c7e62705f64188da88d202db4cd
          path: .uquant-source
          persist-credentials: false
      - name: Full tests with branch coverage
        if: runner.os == 'Linux'
        env:
          FIRMQUANT_UQUANT_SOURCE_CHECKOUT: ${{ github.workspace }}/.uquant-source
        run: uv run pytest --cov=firmquant --cov-branch --cov-fail-under=85
      - name: Windows unit tests
        if: runner.os == 'Windows'
        run: uv run pytest tests/unit -q
      - name: Compile
        run: uv run python -m compileall -q src scripts tests
      - name: Documentation and CLI contract
        run: uv run python scripts/check_docs.py

  uquant-parity:
    name: Exact uquant source parity
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout firmquant
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Checkout locked uquant source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ychenracing/uquant
          ref: 105695aacd3d1c7e62705f64188da88d202db4cd
          path: .uquant-source
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.11.33"
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --frozen --extra dev
      - name: Run strategy integration and exact parity
        env:
          FIRMQUANT_UQUANT_SOURCE_CHECKOUT: ${{ github.workspace }}/.uquant-source
        run: >-
          uv run pytest
          tests/unit/strategy
          tests/integration/test_uquant_account_sync.py
          tests/integration/test_uquant_parity.py
          -q
      - name: Verify deterministic uquant wheel twice
        run: >-
          uv run python scripts/build_reproducible_wheels.py
          --source-root .uquant-source
          --output-dir dist/uquant
          --verify-twice
