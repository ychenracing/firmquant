name: Fix execution evidence tests

on:
  pull_request:

permissions:
  contents: write

env:
  FIRMQ_CI: "1"
  FIRMQ_MODE: PAPER
  FIRMQ_LIVE_TRADING_ENABLED: "false"
  UV_FROZEN: "1"

jobs:
  repair:
    if: github.head_ref == 'codex/execution-evidence-readiness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          clean: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: "0.11.33"
      - name: Update and verify current contracts
        run: |
          uv sync --frozen --extra dev
          uv run python scripts/update_execution_evidence_contract_tests.py
          uv run ruff format tests/unit/application/test_production_services_acceptance.py tests/unit/application/test_promotion_store.py
          uv run ruff check tests/unit/application/test_production_services_acceptance.py tests/unit/application/test_promotion_store.py
          uv run pytest \
            tests/unit/application/test_production_services_acceptance.py::test_canary_promotion_gate_is_identity_bound \
            tests/unit/application/test_production_services_acceptance.py::test_shadow_execution_records_hypothetical_orders_and_never_writes \
            tests/unit/application/test_promotion_store.py \
            tests/unit/test_documented_defaults.py::test_readme_cli_command_inventory_matches_code \
            -q
      - name: Commit verified contract repair
        run: |
          rm -f scripts/update_execution_evidence_contract_tests.py
          rm -f .github/workflows/fix-execution-evidence-tests.yml
          git config user.name firmquant-bot
          git config user.email firmquant-bot@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Align tests with immutable execution evidence"
          git push origin HEAD:codex/execution-evidence-readiness
