name: Full locked execution replay

on:
  pull_request:

permissions:
  contents: read

env:
  FIRMQ_CI: "1"
  FIRMQ_MODE: PAPER
  FIRMQ_LIVE_TRADING_ENABLED: "false"
  UV_FROZEN: "1"

jobs:
  replay:
    if: github.head_ref == 'codex/execution-evidence-readiness'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ychenracing/uquant
          ref: 105695aacd3d1c7e62705f64188da88d202db4cd
          path: .uquant-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: "0.11.33"
      - name: Sync locked environment
        run: |
          printf '%s\n' '.uquant-source/' >> .git/info/exclude
          uv sync --frozen --extra dev
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Run full replay twice and prove byte identity
        env:
          FIRMQUANT_UQUANT_SOURCE_CHECKOUT: ${{ github.workspace }}/.uquant-source
          PYTHONPATH: ${{ github.workspace }}/.uquant-source:${{ github.workspace }}/src
          REPLAY_ONE: ${{ runner.temp }}/firmquant-replay-1.json
          REPLAY_TWO: ${{ runner.temp }}/firmquant-replay-2.json
        shell: bash
        run: |
          uv run python - <<'PY'
          import os
          from datetime import date
          from decimal import Decimal
          from pathlib import Path
          from firmquant.execution.replay_runner import run_execution_replay

          source = Path(os.environ["FIRMQUANT_UQUANT_SOURCE_CHECKOUT"])
          summary = run_execution_replay(
              source_checkout=source,
              data_root=source / "data" / "frozen",
              start=date(2023, 1, 3),
              end=date(2026, 8, 5),
              max_price_deviation_bps=Decimal("200"),
          )
          Path(os.environ["REPLAY_ONE"]).write_text(summary.canonical_json() + "\n", encoding="utf-8")
          PY
          uv run python - <<'PY'
          import os
          from datetime import date
          from decimal import Decimal
          from pathlib import Path
          from firmquant.execution.replay_runner import run_execution_replay

          source = Path(os.environ["FIRMQUANT_UQUANT_SOURCE_CHECKOUT"])
          summary = run_execution_replay(
              source_checkout=source,
              data_root=source / "data" / "frozen",
              start=date(2023, 1, 3),
              end=date(2026, 8, 5),
              max_price_deviation_bps=Decimal("200"),
          )
          Path(os.environ["REPLAY_TWO"]).write_text(summary.canonical_json() + "\n", encoding="utf-8")
          PY
          cmp --silent "$REPLAY_ONE" "$REPLAY_TWO"
          sha256sum "$REPLAY_ONE" "$REPLAY_TWO" > "${RUNNER_TEMP}/firmquant-replay-sha256.txt"
          cat "$REPLAY_ONE"
          cat "${RUNNER_TEMP}/firmquant-replay-sha256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-locked-execution-replay
          path: |
            ${{ runner.temp }}/firmquant-replay-1.json
            ${{ runner.temp }}/firmquant-replay-2.json
            ${{ runner.temp }}/firmquant-replay-sha256.txt
          if-no-files-found: error
          retention-days: 7
