name: tmp-format-durable-finalization
on:
  push:
    branches:
      - codex/account-authority-reconciliation
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply exact formatter output
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/firmquant/reconciliation/service.py')
          text = path.read_text(encoding='utf-8')
          old = '''def _receipt_identity(receipt: ReconciliationReceipt) -> str:\n    return "recon_" + hashlib.sha256(\n        canonical_json(\n            {\n                "kind": receipt.kind,\n                "details_sha256": receipt.details_sha256,\n                "started_at": receipt.started_at,\n                "completed_at": receipt.completed_at,\n            }\n        ).encode("utf-8")\n    ).hexdigest()\n'''
          new = '''def _receipt_identity(receipt: ReconciliationReceipt) -> str:\n    return (\n        "recon_"\n        + hashlib.sha256(\n            canonical_json(\n                {\n                    "kind": receipt.kind,\n                    "details_sha256": receipt.details_sha256,\n                    "started_at": receipt.started_at,\n                    "completed_at": receipt.completed_at,\n                }\n            ).encode("utf-8")\n        ).hexdigest()\n    )\n'''
          if text.count(old) != 1:
              raise SystemExit('expected formatter anchor exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git rm .github/workflows/tmp-format-durable-finalization.yml
          git config user.name firmquant-agent
          git config user.email firmquant-agent@users.noreply.github.com
          git add src/firmquant/reconciliation/service.py
          git commit -m "style: format durable reconciliation finalization"
          git push origin HEAD:codex/account-authority-reconciliation
