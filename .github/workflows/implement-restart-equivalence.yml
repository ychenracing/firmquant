name: Implement restart equivalence

on:
  pull_request:

permissions:
  contents: write

env:
  FIRMQ_CI: "1"
  FIRMQ_MODE: PAPER
  FIRMQ_LIVE_TRADING_ENABLED: "false"
  UV_FROZEN: "1"

jobs:
  green:
    if: github.head_ref == 'codex/execution-evidence-readiness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          clean: false
          fetch-depth: 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ychenracing/uquant
          ref: 105695aacd3d1c7e62705f64188da88d202db4cd
          path: .uquant-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: "0.11.33"
      - name: Implement and verify restart roundtrip
        env:
          FIRMQUANT_UQUANT_SOURCE_CHECKOUT: ${{ github.workspace }}/.uquant-source
          PYTHONPATH: ${{ github.workspace }}/.uquant-source:${{ github.workspace }}/src
        run: |
          uv sync --frozen --extra dev
          uv run python scripts/implement_restart_equivalence.py
          uv run ruff format src/firmquant/execution/replay_runner.py tests/integration/test_execution_replay_restart.py
          uv run ruff check src/firmquant/execution/replay_runner.py tests/integration/test_execution_replay_restart.py
          uv run mypy src scripts
          uv run pytest tests/integration/test_execution_replay_restart.py -q
      - name: Commit GREEN restart contract
        run: |
          rm -f scripts/implement_restart_equivalence.py
          rm -f .github/workflows/implement-restart-equivalence.yml
          rm -f .github/workflows/restart-equivalence-red.yml
          git config user.name firmquant-bot
          git config user.email firmquant-bot@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Prove replay restart equivalence"
          git push origin HEAD:codex/execution-evidence-readiness
