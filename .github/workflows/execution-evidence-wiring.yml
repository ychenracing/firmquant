name: Execution evidence wiring

on:
  push:
    branches:
      - codex/execution-evidence-readiness
    paths:
      - scripts/apply_execution_evidence_wiring.py
      - .github/workflows/execution-evidence-wiring.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/execution-evidence-readiness
          clean: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: "0.11.33"
      - name: Apply exact wiring patch
        run: python scripts/apply_execution_evidence_wiring.py
      - name: Sync locked environment
        run: uv sync --frozen --extra dev
      - name: Normalize touched Python
        run: |
          uv run ruff check --fix src/firmquant/application/production_services.py src/firmquant/application/execution_evidence_runtime.py
          uv run ruff format src/firmquant/application/production_services.py src/firmquant/application/execution_evidence_runtime.py
      - name: Commit exact patch
        run: |
          git config user.name "firmquant-bot"
          git config user.email "firmquant-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Wire immutable production execution evidence"
          git push origin HEAD:codex/execution-evidence-readiness
