name: Temporary write-state patch

on:
  push:
    branches:
      - codex/production-live-hardening-20260826

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Patch durable order state machine once
        shell: bash
        run: |
          if git log -1 --pretty=%s | grep -q '^fix(auto): write state'; then
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path

          path = Path("src/firmquant/domain/orders.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "    CancelConfirmed,\n    CancelRequested,\n",
              "    CancelConfirmed,\n    CancelNotAccepted,\n    CancelRequested,\n",
          )
          text = text.replace(
              "    SubmitOutcomeUnknown,\n    SubmitStarted,\n",
              "    SubmitNotAccepted,\n    SubmitOutcomeUnknown,\n    SubmitStarted,\n",
          )
          text = text.replace(
              "        OrderState.SUBMITTING: frozenset(\n            {\n                OrderState.ACKNOWLEDGED,",
              "        OrderState.SUBMITTING: frozenset(\n            {\n                OrderState.ARMED,\n                OrderState.ACKNOWLEDGED,",
          )
          text = text.replace(
              "        OrderState.CANCEL_REQUESTED: frozenset(\n            {\n                OrderState.FILLED,\n                OrderState.CANCELLED,\n                OrderState.UNKNOWN,\n            }\n        ),",
              "        OrderState.CANCEL_REQUESTED: frozenset(\n            {\n                OrderState.ACKNOWLEDGED,\n                OrderState.PARTIALLY_FILLED,\n                OrderState.FILLED,\n                OrderState.CANCELLED,\n                OrderState.UNKNOWN,\n            }\n        ),",
          )
          submit_needle = "        if isinstance(event, SubmitOutcomeUnknown):\n"
          submit_block = '''        if isinstance(event, SubmitNotAccepted):\n            if self.state is not OrderState.SUBMITTING:\n                raise DomainTransitionError(\n                    f"illegal order transition {self.state.value} via SubmitNotAccepted"\n                )\n            return self._updated(event, state=OrderState.ARMED)\n'''
          if submit_block not in text:
              if submit_needle not in text:
                  raise SystemExit("submit insertion point missing")
              text = text.replace(submit_needle, submit_block + submit_needle, 1)
          cancel_needle = "        if isinstance(event, CancelConfirmed):\n"
          cancel_block = '''        if isinstance(event, CancelNotAccepted):\n            if self.state is not OrderState.CANCEL_REQUESTED:\n                raise DomainTransitionError(\n                    f"illegal order transition {self.state.value} via CancelNotAccepted"\n                )\n            target = (\n                OrderState.PARTIALLY_FILLED\n                if self.filled_shares.is_positive\n                else OrderState.ACKNOWLEDGED\n            )\n            return self._updated(event, state=target)\n'''
          if cancel_block not in text:
              if cancel_needle not in text:
                  raise SystemExit("cancel insertion point missing")
              text = text.replace(cancel_needle, cancel_block + cancel_needle, 1)
          path.write_text(text, encoding="utf-8", newline="\n")
          PY
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/firmquant/domain/orders.py
          git commit -m "fix(auto): write state handles definite rejection"
          git push origin HEAD:${GITHUB_REF_NAME}
