name: Runtime Style Fix

on:
  push:
    branches:
      - codex/runtime-time-health

permissions:
  contents: write

jobs:
  fix:
    if: github.repository == 'ychenracing/firmquant'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/runtime-time-health
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.33'
      - name: Sync locked environment
        run: uv sync --frozen --extra dev
      - name: Apply deterministic style cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/firmquant/application/operations.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '生产只读 smoke 已完成并持久化证据，券商写调用为 0。',
              '生产只读 smoke 已完成并持久化证据。券商写调用为 0。',
          )
          path.write_text(text, encoding='utf-8')
          PY
          uv run ruff check --fix \
            src/firmquant/application/operations.py \
            src/firmquant/application/production_services.py \
            src/firmquant/broker/production_smoke.py \
            src/firmquant/risk/capability.py
          uv run ruff format \
            src/firmquant/application/operations.py \
            src/firmquant/application/production_services.py \
            src/firmquant/broker/production_smoke.py \
            src/firmquant/risk/capability.py
          rm .github/workflows/runtime-style-fix.yml
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'firmquant-runtime-safety-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/firmquant/application/operations.py \
                  src/firmquant/application/production_services.py \
                  src/firmquant/broker/production_smoke.py \
                  src/firmquant/risk/capability.py \
                  .github/workflows/runtime-style-fix.yml
          git commit -m 'Clean runtime safety static checks'
          git push origin HEAD:codex/runtime-time-health
