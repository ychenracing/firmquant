name: Adjusted price-limit contract

on:
  pull_request:

permissions:
  contents: write

env:
  FIRMQ_CI: "1"
  FIRMQ_MODE: REPLAY
  FIRMQ_LIVE_TRADING_ENABLED: "false"
  UV_FROZEN: "1"

jobs:
  contract:
    if: github.head_ref == 'codex/execution-evidence-readiness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          clean: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: "0.11.33"
      - name: Implement and verify adjusted price-limit reconstruction
        run: |
          uv sync --frozen --extra dev
          uv run python scripts/implement_adjusted_limits.py
          uv run ruff format src/firmquant/execution/replay_runner.py tests/unit/execution/test_adjusted_price_limits.py
          uv run ruff check src/firmquant/execution/replay_runner.py tests/unit/execution/test_adjusted_price_limits.py
          uv run mypy src
          uv run pytest \
            tests/unit/execution/test_adjusted_price_limits.py \
            tests/unit/execution/test_execution_replay.py \
            tests/unit/execution/test_execution_replay_branches.py \
            tests/unit/execution/test_replay_runner_branches.py -q
      - name: Commit verified GREEN implementation
        run: |
          git rm scripts/implement_adjusted_limits.py
          git rm .github/workflows/adjusted-price-limit-contract.yml
          git config user.name firmquant-bot
          git config user.email firmquant-bot@users.noreply.github.com
          git add src/firmquant/execution/replay_runner.py tests/unit/execution/test_adjusted_price_limits.py
          git diff --cached --check
          git commit -m "Reconcile adjusted replay price-limit coordinates"
          git push origin HEAD:codex/execution-evidence-readiness
