name: Codex apply governance surface transform

on:
  push:
    branches:
      - codex/data-calendar-checkpoint
    paths:
      - .github/codex_governance_patch.py
      - .github/workflows/codex-governance-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: codex/data-calendar-checkpoint
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Apply exact governance transforms
        run: python .github/codex_governance_patch.py
      - name: Format and lint touched files
        run: |
          python -m pip install --disable-pip-version-check ruff==0.16.4
          ruff format \
            src/firmquant/application/data_calendar_control.py \
            src/firmquant/application/production_services.py \
            src/firmquant/application/sessions.py \
            src/firmquant/cli.py \
            src/firmquant/observability/reports.py \
            src/firmquant/persistence/backup.py
          ruff check --fix \
            src/firmquant/application/data_calendar_control.py \
            src/firmquant/application/production_services.py \
            src/firmquant/application/sessions.py \
            src/firmquant/cli.py \
            src/firmquant/observability/reports.py \
            src/firmquant/persistence/backup.py
          git diff --check
      - name: Commit governance surface
        run: |
          git config user.name ychenracing
          git config user.email ychenracing@163.com
          git add src
          git diff --cached --check
          git commit -m 'feat: expose governed data and calendar controls'
          git push origin HEAD:codex/data-calendar-checkpoint
