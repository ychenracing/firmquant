name: Codex generate checkpoint artifacts

on:
  push:
    branches:
      - codex/data-calendar-checkpoint
    paths:
      - .github/codex_apply_checkpoint.py
      - .github/workflows/codex-apply-checkpoint.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: codex/data-calendar-checkpoint
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Apply exact reviewed transforms
        run: python .github/codex_apply_checkpoint.py
      - name: Format touched Python files
        run: |
          python -m pip install --disable-pip-version-check ruff==0.16.4
          ruff format \
            src/firmquant/application/close_checkpoint.py \
            src/firmquant/application/production_services.py \
            src/firmquant/market_data/generations.py \
            src/firmquant/market_data/xtquant_daily.py \
            src/firmquant/market_data/xtquant_history.py \
            src/firmquant/market_data/validation.py \
            src/firmquant/observability/reports.py \
            src/firmquant/persistence/backup.py \
            tests/unit/application/test_production_services_acceptance.py \
            tests/unit/market_data/test_calendar_governance.py \
            tests/unit/market_data/test_close_data_governance.py \
            tests/unit/market_data/test_data_generations.py \
            tests/unit/market_data/test_validation_suspension.py \
            tests/unit/market_data/test_xtquant_history_status.py \
            tests/integration/test_complete_backup_bundle.py
          ruff check --fix \
            src/firmquant/application/close_checkpoint.py \
            src/firmquant/application/production_services.py \
            src/firmquant/market_data/generations.py \
            src/firmquant/market_data/xtquant_daily.py \
            src/firmquant/market_data/xtquant_history.py \
            src/firmquant/market_data/validation.py \
            src/firmquant/observability/reports.py \
            src/firmquant/persistence/backup.py \
            tests/unit/application/test_production_services_acceptance.py \
            tests/unit/market_data/test_calendar_governance.py \
            tests/unit/market_data/test_validation_suspension.py \
            tests/unit/market_data/test_xtquant_history_status.py \
            tests/integration/test_complete_backup_bundle.py
          git diff --check
      - name: Stage transformed files
        run: |
          mkdir -p /tmp/firmquant-checkpoint/src/firmquant/application
          mkdir -p /tmp/firmquant-checkpoint/src/firmquant/market_data
          mkdir -p /tmp/firmquant-checkpoint/src/firmquant/observability
          mkdir -p /tmp/firmquant-checkpoint/src/firmquant/persistence
          mkdir -p /tmp/firmquant-checkpoint/tests/unit/application
          cp src/firmquant/application/close_checkpoint.py /tmp/firmquant-checkpoint/src/firmquant/application/
          cp src/firmquant/application/production_services.py /tmp/firmquant-checkpoint/src/firmquant/application/
          cp src/firmquant/market_data/generations.py /tmp/firmquant-checkpoint/src/firmquant/market_data/
          cp src/firmquant/market_data/xtquant_daily.py /tmp/firmquant-checkpoint/src/firmquant/market_data/
          cp src/firmquant/market_data/xtquant_history.py /tmp/firmquant-checkpoint/src/firmquant/market_data/
          cp src/firmquant/market_data/validation.py /tmp/firmquant-checkpoint/src/firmquant/market_data/
          cp src/firmquant/observability/reports.py /tmp/firmquant-checkpoint/src/firmquant/observability/
          cp src/firmquant/persistence/backup.py /tmp/firmquant-checkpoint/src/firmquant/persistence/
          cp tests/unit/application/test_production_services_acceptance.py /tmp/firmquant-checkpoint/tests/unit/application/
          git diff > /tmp/firmquant-checkpoint/transform.patch
      - name: Upload transformed checkpoint
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: close-checkpoint-transform
          path: /tmp/firmquant-checkpoint
          if-no-files-found: error
