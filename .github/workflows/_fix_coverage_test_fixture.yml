name: fix-coverage-test-fixture

on:
  push:
    branches:
      - codex/account-authority-reconciliation
    paths:
      - .github/workflows/_fix_coverage_test_fixture.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/account-authority-reconciliation
          fetch-depth: 0
      - name: Fix valid broker fixture
        shell: python
        run: |
          from pathlib import Path
          path = Path("tests/unit/strategy/test_account_authority_fail_closed_edges.py")
          text = path.read_text(encoding="utf-8")
          old = 'account=replace(snapshot.account, total_assets=Money(Decimal("999"))),'
          new = 'account=replace(snapshot.account, total_assets=Money(Decimal("1001"))),'
          if text.count(old) != 1:
              raise SystemExit("fixture target drifted")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          Path(".github/workflows/_fix_coverage_test_fixture.yml").unlink()
      - name: Commit and self-delete
        run: |
          git config user.name firmquant-agent
          git config user.email firmquant-agent@users.noreply.github.com
          git add -A
          git commit -m "test: keep bootstrap summary fixture domain-valid"
          git push origin HEAD:codex/account-authority-reconciliation
