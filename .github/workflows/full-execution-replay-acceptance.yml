name: Full execution replay acceptance

on:
  pull_request:

permissions:
  contents: write

env:
  FIRMQ_CI: "1"
  FIRMQ_MODE: REPLAY
  FIRMQ_LIVE_TRADING_ENABLED: "false"
  UV_FROZEN: "1"

jobs:
  replay:
    if: github.head_ref == 'codex/execution-evidence-readiness'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          clean: false
          fetch-depth: 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ychenracing/uquant
          ref: 105695aacd3d1c7e62705f64188da88d202db4cd
          path: .uquant-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: "0.11.33"
      - name: Diagnose inferred daily-limit mismatches
        env:
          FIRMQUANT_UQUANT_SOURCE_CHECKOUT: ${{ github.workspace }}/.uquant-source
          PYTHONPATH: ${{ github.workspace }}/.uquant-source:${{ github.workspace }}/src
        run: |
          printf '%s\n' '.uquant-source/' >> .git/info/exclude
          uv sync --frozen --extra dev
          uv run python scripts/verify_source_baseline.py
          uv run python - <<'PY'
          from datetime import date
          from decimal import Decimal
          from pathlib import Path

          from firmquant.execution.replay_runner import _daily_bar, _load_panels
          from firmquant.strategy.universe import UniversePolicy

          start = date(2023, 1, 3)
          end = date(2026, 8, 5)
          policy = UniversePolicy.from_uquant(None, as_of=end)
          panels = _load_panels(Path('.uquant-source/data/frozen'), policy.deployment_symbols)
          violations = []
          for symbol, panel in sorted(panels.items()):
              if symbol in {'000300.SH', '000682.SH'}:
                  continue
              for timestamp in panel.index:
                  session = timestamp.date()
                  if session < start or session > end:
                      continue
                  try:
                      bar = _daily_bar(symbol, panel, session)
                  except Exception:
                      continue
                  if bar.suspended:
                      continue
                  fields = {
                      'open': bar.open,
                      'high': bar.high,
                      'low': bar.low,
                      'close': bar.close,
                  }
                  bad = {
                      name: value
                      for name, value in fields.items()
                      if value < bar.limit_down or value > bar.limit_up
                  }
                  if bad:
                      violations.append(
                          {
                              'symbol': symbol,
                              'session': session.isoformat(),
                              'previous_close': str(bar.previous_close),
                              'limit_down': str(bar.limit_down),
                              'limit_up': str(bar.limit_up),
                              'open': str(bar.open),
                              'high': str(bar.high),
                              'low': str(bar.low),
                              'close': str(bar.close),
                              'bad': {key: str(value) for key, value in bad.items()},
                              'open_vs_prev_pct': str((bar.open / bar.previous_close - Decimal(1)) * Decimal(100)),
                          }
                      )
          print(f'LIMIT_MISMATCH_COUNT={len(violations)}')
          for item in violations[:100]:
              print('LIMIT_MISMATCH', item)
          if violations:
              raise SystemExit('inferred price limits conflict with authoritative frozen OHLC; diagnose before replay')
          PY
      - name: Run full locked-data execution-aware replay
        env:
          FIRMQUANT_UQUANT_SOURCE_CHECKOUT: ${{ github.workspace }}/.uquant-source
          PYTHONPATH: ${{ github.workspace }}/.uquant-source:${{ github.workspace }}/src
        run: |
          uv run python - <<'PY'
          import json
          from datetime import date
          from pathlib import Path

          from firmquant.config import Settings
          from firmquant.execution.replay_runner import run_execution_replay

          settings = Settings()
          summary = run_execution_replay(
              source_checkout=Path('.uquant-source'),
              data_root=Path('.uquant-source/data/frozen'),
              start=date(2023, 1, 3),
              end=date(2026, 8, 5),
              max_price_deviation_bps=settings.execution.max_price_deviation_bps,
          )
          canonical = summary.canonical_json()
          payload = json.loads(canonical)
          print('FIRMQUANT_FULL_EXECUTION_REPLAY_BEGIN')
          print(canonical)
          print('FIRMQUANT_FULL_EXECUTION_REPLAY_END')
          with open(Path(__import__('os').environ['GITHUB_STEP_SUMMARY']), 'a', encoding='utf-8') as handle:
              handle.write('## Full execution-aware replay\n\n')
              handle.write('`2023-01-03` through `2026-08-05`, locked uquant `105695aacd3d1c7e62705f64188da88d202db4cd`.\n\n')
              handle.write('```json\n' + json.dumps(payload, indent=2, sort_keys=True) + '\n```\n')
          PY
      - name: Remove temporary acceptance workflow after success
        run: |
          git rm .github/workflows/full-execution-replay-acceptance.yml
          git config user.name firmquant-bot
          git config user.email firmquant-bot@users.noreply.github.com
          git diff --cached --check
          git commit -m "Remove temporary execution replay acceptance workflow"
          git push origin HEAD:codex/execution-evidence-readiness
