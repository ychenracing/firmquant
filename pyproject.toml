[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "firmquant"
version = "0.1.0"
description = "Fail-closed A-share daily automated execution system powered by uquant"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.11,<3",
    "tzdata>=2025.2",
    "uquant @ git+https://github.com/ychenracing/uquant.git@105695aacd3d1c7e62705f64188da88d202db4cd",
]

[project.optional-dependencies]
dev = [
    "bandit[toml]>=1.8",
    "build>=1.2",
    "hypothesis>=6.120",
    "mypy>=1.14,<2",
    "pip-audit>=2.7",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.8",
]

[project.scripts]
firmquant = "firmquant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["firmquant*"]

[tool.setuptools.package-data]
"firmquant.resources" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-config --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PERF", "RUF"]
ignore = ["E501", "SIM108", "UP042"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true

[tool.coverage.run]
branch = true
source = ["firmquant"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
